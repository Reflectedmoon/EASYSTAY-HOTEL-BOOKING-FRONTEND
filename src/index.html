<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyStay Hotel Booking</title>
  <script>
    // 确保 app 元素存在
    if (!document.getElementById('app')) {
      const appDiv = document.createElement('div');
      appDiv.id = 'app';
      document.body.appendChild(appDiv);
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Taro 会自动注入脚本 -->
</body>
</html>
